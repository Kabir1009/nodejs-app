trigger:
- main
- feature/*

pool:
  vmImage: ubuntu-latest

steps:

- task: UseNode@1
  inputs:
    version: '20.x'
  displayName: 'Install Node.js'

- script: |
    node -v
    npm -v
    pwd
    ls -la
  displayName: 'Environment Information'

- script: npm ci
  displayName: 'Install Dependencies'

- script: npm test
  displayName: 'Run Tests'
